name = "telegram-filestore-bot"
main = "workers.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV Namespace ──────────────────────────────────────────────────────────────
# Create with: wrangler kv:namespace create "KV"
# Then paste the id below
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# ─── Environment Variables ─────────────────────────────────────────────────────
# Secrets are set via: wrangler secret put <KEY>
# Do NOT put secrets here — use wrangler secret put or the dashboard

[vars]
BOT_USERNAME    = "your_bot_username"        # without @
WORKER_URL      = "https://your-worker.your-subdomain.workers.dev"
FORCE_SUB_CHANNELS = "@your_channel"         # comma-separated, e.g. "@chan1,@chan2" or leave empty

# ─── Secrets (set via CLI, not here) ──────────────────────────────────────────
# wrangler secret put BOT_TOKEN
# wrangler secret put CHANNEL_ID          (e.g. -100123456789)
# wrangler secret put ADMINS              (e.g. 123456,789012)
# wrangler secret put WEBHOOK_SECRET      (any random string)

# ─── Routes ────────────────────────────────────────────────────────────────────
# Uncomment if using a custom domain
# routes = [{ pattern = "bot.yourdomain.com/*", zone_name = "yourdomain.com" }]

# ─── Build ─────────────────────────────────────────────────────────────────────
[build]
command = ""

# ─── Limits ────────────────────────────────────────────────────────────────────
[limits]
cpu_ms = 50
